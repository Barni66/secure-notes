<!DOCTYPE html>
<html>
<head>
    <title>Create note</title>
</head>
<body>

<h1>Create note</h1>

<form method="POST">
    {% csrf_token %}

    <p>
        Title:
        <input type="text" name="title">
    </p>

    <p>
        Content:
    </p>

    <textarea name="content"></textarea>

    <p>Secret:</p>

    <textarea name="private data"></textarea>

    <br><br>

    <input type="submit" value="Save">

</form>

</body>
</html>
