<!DOCTYPE html>
<html>
<head>
    <title>My Notes</title>
</head>
<body>

<h1>My Notes</h1>

<a href="/create/">Create Note</a>

<ul>
{% for note in notes %}
    <li>
        <a href="/note/{{ note.id }}/">
            {{ note.title }}
        </a>
        <a href="/delete/{{ note.id }}/">
            Delete
        </a>
        <a href="/search/">Search</a>
    </li>
{% endfor %}
</ul>

<a href="/logout/">Logout</a>

</body>
</html>
